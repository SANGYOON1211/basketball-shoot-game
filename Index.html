<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>농구 슛 게임</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      background: #0b1320;
      color: #e7eef7;
      font-family: system-ui, "Malgun Gothic", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    main {
      width: min(100%, 960px);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    button {
      padding: 9px 16px;
      border: 1px solid #43617b;
      border-radius: 8px;
      background: #18283e;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #24394f;
    }

    button:focus-visible,
    canvas:focus-visible {
      outline: 3px solid #70efbd;
      outline-offset: 4px;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 2;
      border: 1px solid #2d435c;
      border-radius: 12px;
      background: #101b2b;
    }

    .help {
      font-size: 14px;
      color: #a8bdd1;
      line-height: 1.8;
    }

    kbd {
      padding: 2px 6px;
      border: 1px solid #354c65;
      border-radius: 4px;
      background: #18283e;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      h1 {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="header">
      <h1>🏀 농구 슛 게임</h1>
      <button id="restart" type="button">다시 시작 (R)</button>
    </div>

    <canvas
      id="game"
      width="960"
      height="640"
      tabindex="0"
      aria-label="키보드 농구 슛 게임"
      aria-describedby="instructions"
    >
      Canvas를 지원하는 브라우저에서 실행해 주세요.
    </canvas>

    <p id="instructions" class="help">
      게임 화면을 클릭한 뒤
      <kbd>←</kbd> / <kbd>↑</kbd>로 각도를 높이고,
      <kbd>→</kbd> / <kbd>↓</kbd>로 낮추세요.<br>
      <kbd>Space</kbd>를 누르고 있다가 놓으면 슛!
      <kbd>R</kbd>: 초기화 ·
      <kbd>Esc</kbd>: 슛 준비 취소<br>
      연습 팁: 기본 각도 55°, 파워 65~70% 부근.
      PC 키보드 플레이용입니다.
    </p>

    <p
      id="status"
      class="sr-only"
      role="status"
      aria-live="polite"
    ></p>
  </main>

  <script>
    "use strict";

    (() => {
      // 게임 설정
      const WIDTH = 960;
      const HEIGHT = 640;
      const FLOOR = 550;

      const GRAVITY = 900;
      const BALL_R = 14;
      const STEP = 1 / 120;

      const START_X = 210;
      const START_Y = 476;

      const HOOP_X = 760;
      const HOOP_Y = 246;
      const HALF_RIM = 35;

      const BOARD_X = 808;
      const BOARD_TOP = 148;
      const BOARD_BOTTOM = 274;

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const status = document.getElementById("status");

      if (!ctx) {
        status.classList.remove("sr-only");
        status.textContent =
          "Canvas를 지원하는 브라우저가 필요합니다.";
        return;
      }

      class BasketballGame {
        constructor() {
          this.keys = new Set();

          this.restart();

          this.lastTime = performance.now();
          this.accumulator = 0;

          this.bindEvents();
          this.resize();
          this.draw();

          requestAnimationFrame(time => this.tick(time));
        }

        setMessage(text, color = "#dbe6f2") {
          this.message = text;
          this.messageColor = color;
          status.textContent = text;
        }

        resetBall() {
          this.x = START_X;
          this.y = START_Y;

          this.vx = 0;
          this.vy = 0;

          this.active = false;
          this.scored = false;
          this.charging = false;

          this.power = 0;
          this.age = 0;
          this.finishIn = null;
        }

        restart() {
          this.angle = 55;

          this.shots = 0;
          this.made = 0;
          this.streak = 0;

          this.keys.clear();
          this.resetBall();

          this.setMessage(
            "스페이스바를 누르고 있다가 놓으면 슛!"
          );
        }

        velocity(power) {
          const speed = 380 + 720 * power;
          const radians = this.angle * Math.PI / 180;

          return {
            vx: speed * Math.cos(radians),
            vy: -speed * Math.sin(radians)
          };
        }

        shoot() {
          if (!this.charging || this.active) return;

          this.charging = false;

          const velocity = this.velocity(this.power);

          this.vx = velocity.vx;
          this.vy = velocity.vy;

          this.active = true;
          this.shots += 1;

          this.setMessage("슛!");
        }

        cancelInput() {
          this.keys.clear();
          this.charging = false;

          if (!this.active) {
            this.power = 0;
          }
        }

        bindEvents() {
          const controls = new Set([
            "ArrowLeft",
            "ArrowRight",
            "ArrowUp",
            "ArrowDown",
            "Space",
            "KeyR",
            "Escape"
          ]);

          // 게임 화면에 포커스가 있을 때 키를 처리합니다.
          canvas.addEventListener("keydown", event => {
            if (!controls.has(event.code)) return;

            // 방향키 및 스페이스바로 페이지가 스크롤되는 것을 방지합니다.
            event.preventDefault();

            if (event.repeat || this.keys.has(event.code)) {
              return;
            }

            this.keys.add(event.code);

            if (event.code === "KeyR") {
              this.restart();
            } else if (event.code === "Escape") {
              this.cancelInput();
            } else if (
              event.code === "Space" &&
              !this.active
            ) {
              this.charging = true;
              this.power = 0;
            }
          });

          canvas.addEventListener("keyup", event => {
            if (!controls.has(event.code)) return;

            event.preventDefault();
            this.keys.delete(event.code);

            if (event.code === "Space") {
              this.shoot();
            }
          });

          canvas.addEventListener("pointerdown", () => {
            canvas.focus();
          });

          canvas.addEventListener("blur", () => {
            this.cancelInput();
          });

          window.addEventListener("blur", () => {
            this.cancelInput();
          });

          // 다른 탭으로 이동하면 입력 상태를 정리합니다.
          document.addEventListener("visibilitychange", () => {
            this.cancelInput();
            this.accumulator = 0;
            this.lastTime = performance.now();
          });

          window.addEventListener("resize", () => {
            this.resize();
          });

          document
            .getElementById("restart")
            .addEventListener("click", () => {
              this.restart();
              canvas.focus();
            });
        }

        resize() {
          // 고해상도 화면에서도 선명하게 표시합니다.
          const dpr = Math.min(
            window.devicePixelRatio || 1,
            2
          );

          canvas.width = Math.round(WIDTH * dpr);
          canvas.height = Math.round(HEIGHT * dpr);

          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        reflect(nx, ny, restitution) {
          const toward = this.vx * nx + this.vy * ny;

          if (toward < 0) {
            this.vx -= (1 + restitution) * toward * nx;
            this.vy -= (1 + restitution) * toward * ny;
          }
        }

        collideRim(rimX) {
          const dx = this.x - rimX;
          const dy = this.y - HOOP_Y;

          const distance = Math.hypot(dx, dy);
          const limit = BALL_R + 4;

          if (distance >= limit) return;

          const nx = distance > 0.00001
            ? dx / distance
            : 0;

          const ny = distance > 0.00001
            ? dy / distance
            : -1;

          this.x = rimX + nx * limit;
          this.y = HOOP_Y + ny * limit;

          this.reflect(nx, ny, 0.62);
        }

        collideBoard() {
          const nearestX = Math.min(
            Math.max(this.x, BOARD_X),
            BOARD_X + 10
          );

          const nearestY = Math.min(
            Math.max(this.y, BOARD_TOP),
            BOARD_BOTTOM
          );

          const dx = this.x - nearestX;
          const dy = this.y - nearestY;
          const distance = Math.hypot(dx, dy);

          if (distance >= BALL_R) return;

          const nx = distance > 0.00001
            ? dx / distance
            : (this.vx >= 0 ? -1 : 1);

          const ny = distance > 0.00001
            ? dy / distance
            : 0;

          const overlap = BALL_R - distance + 0.1;

          this.x += nx * overlap;
          this.y += ny * overlap;

          this.reflect(nx, ny, 0.7);
        }

        endShot() {
          if (!this.scored) {
            this.streak = 0;

            this.setMessage(
              "아쉽네요! 각도와 힘을 조절해 보세요.",
              "#ffce90"
            );
          }

          this.resetBall();
        }

        update(dt) {
          if (!this.active) {
            const higher =
              this.keys.has("ArrowLeft") ||
              this.keys.has("ArrowUp");

            const lower =
              this.keys.has("ArrowRight") ||
              this.keys.has("ArrowDown");

            const direction =
              Number(higher) - Number(lower);

            this.angle = Math.max(
              30,
              Math.min(
                80,
                this.angle + direction * 38 * dt
              )
            );

            if (this.charging) {
              this.power = Math.min(
                1,
                this.power + dt / 1.2
              );
            }

            return;
          }

          this.age += dt;

          if (this.finishIn !== null) {
            this.finishIn -= dt;

            if (this.finishIn <= 0) {
              this.endShot();
              return;
            }
          }

          const oldX = this.x;
          const oldY = this.y;

          // 중력과 이동
          this.vy += GRAVITY * dt;
          this.x += this.vx * dt;
          this.y += this.vy * dt;

          // 내려오는 공이 골대 내부를 통과할 때 한 번만 득점합니다.
          if (
            !this.scored &&
            this.vy > 0 &&
            oldY < HOOP_Y &&
            this.y >= HOOP_Y
          ) {
            const fraction =
              (HOOP_Y - oldY) / (this.y - oldY);

            const crossingX =
              oldX + (this.x - oldX) * fraction;

            const clearance =
              HALF_RIM - BALL_R - 3;

            if (
              Math.abs(crossingX - HOOP_X) <= clearance
            ) {
              this.scored = true;
              this.made += 1;
              this.streak += 1;
              this.finishIn = 0.9;

              this.setMessage(
                `골! +2점  |  ${this.streak}연속 성공`,
                "#70efbd"
              );
            }
          }

          this.collideBoard();
          this.collideRim(HOOP_X - HALF_RIM);
          this.collideRim(HOOP_X + HALF_RIM);

          // 바닥에 닿으면 튕긴 뒤 다음 공을 준비합니다.
          if (this.y + BALL_R >= FLOOR) {
            this.y = FLOOR - BALL_R;

            if (this.vy > 0) {
              this.vy *= -0.38;
              this.vx *= 0.72;
            }

            if (this.finishIn === null) {
              this.finishIn = 0.7;
            }
          }

          if (
            this.x < -80 ||
            this.x > WIDTH + 80 ||
            this.age > 5
          ) {
            this.endShot();
          }
        }

        // 그리기 보조 함수
        rect(x, y, width, height, fill, stroke = null, lineWidth = 1) {
          if (fill) {
            ctx.fillStyle = fill;
            ctx.fillRect(x, y, width, height);
          }

          if (stroke) {
            ctx.strokeStyle = stroke;
            ctx.lineWidth = lineWidth;
            ctx.strokeRect(x, y, width, height);
          }
        }

        line(points, color, width = 1) {
          ctx.beginPath();
          ctx.moveTo(points[0], points[1]);

          for (let i = 2; i < points.length; i += 2) {
            ctx.lineTo(points[i], points[i + 1]);
          }

          ctx.strokeStyle = color;
          ctx.lineWidth = width;
          ctx.stroke();
        }

        ellipse(x, y, rx, ry, fill = null, stroke = null, width = 1) {
          ctx.beginPath();
          ctx.ellipse(
            x, y, rx, ry,
            0, 0, Math.PI * 2
          );

          if (fill) {
            ctx.fillStyle = fill;
            ctx.fill();
          }

          if (stroke) {
            ctx.strokeStyle = stroke;
            ctx.lineWidth = width;
            ctx.stroke();
          }
        }

        text(x, y, content, size = 14, color = "#e7eef7", align = "center") {
          ctx.font =
            `${size}px system-ui, "Malgun Gothic", sans-serif`;

          ctx.fillStyle = color;
          ctx.textAlign = align;
          ctx.textBaseline = "middle";
          ctx.fillText(content, x, y);
        }

        drawBackground() {
          this.rect(0, 0, WIDTH, HEIGHT, "#101b2b");
          this.rect(
            0, 100, WIDTH, FLOOR - 100, "#18283e"
          );

          for (const y of [150, 195, 240]) {
            this.line(
              [30, y, 930, y],
              "#24394f",
              2
            );
          }

          // 코트
          this.rect(
            0, FLOOR, WIDTH, HEIGHT - FLOOR, "#b8773f"
          );

          for (let x = 0; x < WIDTH; x += 80) {
            this.line(
              [x, FLOOR, x - 32, HEIGHT],
              "#966032"
            );
          }

          this.line(
            [0, FLOOR, WIDTH, FLOOR],
            "#efd0a0",
            3
          );

          this.ellipse(
            662, 648, 227, 82,
            null, "#f4d3a1", 3
          );

          // 골대 지지대와 백보드
          this.line(
            [833, 196, 867, 196, 867, FLOOR],
            "#536479",
            12
          );

          this.rect(
            BOARD_X,
            BOARD_TOP,
            10,
            BOARD_BOTTOM - BOARD_TOP,
            "#c4dced",
            "#ffffff",
            2
          );

          // 그물
          for (let i = 0; i <= 6; i++) {
            const x =
              HOOP_X - HALF_RIM +
              2 * HALF_RIM * i / 6;

            this.line(
              [
                x,
                HOOP_Y + 3,
                HOOP_X + (x - HOOP_X) * 0.58,
                HOOP_Y + 56
              ],
              "#c4d6e6",
              2
            );
          }

          for (let i = 1; i < 4; i++) {
            const y = HOOP_Y + i * 14;
            const half =
              HALF_RIM * (1 - 0.42 * i / 4);

            this.line(
              [HOOP_X - half, y, HOOP_X + half, y],
              "#a7bed1"
            );
          }

          // 선수
          this.ellipse(
            165, 455, 14, 14, "#f5bc82"
          );

          this.line(
            [165, 477, 165, 505],
            "#60c9eb",
            22
          );

          this.line(
            [165, 482, 188, 489, 204, 481],
            "#f5bc82",
            9
          );

          this.line(
            [161, 506, 150, 540],
            "#cbd9ec",
            9
          );

          this.line(
            [171, 506, 187, 540],
            "#cbd9ec",
            9
          );

          this.text(
            30, 35, "BASKETBALL",
            24, "#ffffff", "left"
          );

          this.text(
            30, 70, "KEYBOARD SHOOTING GAME",
            10, "#86a2bd", "left"
          );

          this.text(
            480, 613,
            "방향키: 각도  |  SPACE: 누르고 있다가 놓아서 슛  |  R: 초기화  |  ESC: 준비 취소",
            12,
            "#fff2dc"
          );
        }

        draw() {
          this.drawBackground();

          const accuracy = this.shots
            ? Math.round(100 * this.made / this.shots)
            : 0;

          this.text(
            935,
            35,
            `${this.made * 2}점    ${this.made}/${this.shots} 성공    성공률 ${accuracy}%`,
            17,
            "#ffffff",
            "right"
          );

          this.text(
            935,
            72,
            `각도 ${Math.round(this.angle)}°    파워 ${Math.round(this.power * 100)}%`,
            12,
            "#93c8eb",
            "right"
          );

          this.text(
            480,
            125,
            this.message,
            16,
            this.messageColor
          );

          // 파워 게이지
          this.text(
            30, 377, "POWER",
            10, "#bcd3e8", "left"
          );

          this.rect(
            30, 399, 215, 20,
            "#0e1928", "#43617b"
          );

          if (this.power > 0) {
            this.rect(
              32,
              401,
              211 * this.power,
              16,
              this.power < 0.85
                ? "#69dfb6"
                : "#ffbc66"
            );
          }

          // 짧은 예상 궤적
          if (!this.active) {
            const previewPower = this.charging
              ? this.power
              : 0.55;

            const velocity =
              this.velocity(previewPower);

            for (let i = 1; i <= 12; i++) {
              const t = i * 0.055;

              const x =
                START_X + velocity.vx * t;

              const y =
                START_Y +
                velocity.vy * t +
                0.5 * GRAVITY * t * t;

              if (y > FLOOR - BALL_R) break;

              this.ellipse(
                x, y, 2, 2, "#729cba"
              );
            }
          }

          // 공 그림자
          const shadow = Math.max(
            5,
            16 - Math.abs(FLOOR - this.y) * 0.016
          );

          this.ellipse(
            this.x,
            FLOOR - 1,
            shadow,
            4,
            "#745030"
          );

          // 농구공
          this.ellipse(
            this.x,
            this.y,
            BALL_R,
            BALL_R,
            "#f58a2d",
            "#422a1c",
            2
          );

          this.line(
            [
              this.x - BALL_R + 2,
              this.y,
              this.x + BALL_R - 2,
              this.y
            ],
            "#593322",
            2
          );

          ctx.beginPath();

          ctx.ellipse(
            this.x,
            this.y,
            6,
            BALL_R - 1,
            0,
            Math.PI / 2,
            Math.PI * 1.5
          );

          ctx.strokeStyle = "#593322";
          ctx.lineWidth = 2;
          ctx.stroke();

          // 림은 마지막에 그립니다.
          this.ellipse(
            HOOP_X,
            HOOP_Y,
            HALF_RIM,
            5,
            null,
            "#ff8141",
            5
          );
        }

        tick(now) {
          // 프레임 속도와 무관하게 고정 간격으로 물리를 계산합니다.
          this.accumulator += Math.min(
            (now - this.lastTime) / 1000,
            0.05
          );

          this.lastTime = now;

          while (this.accumulator >= STEP) {
            this.update(STEP);
            this.accumulator -= STEP;
          }

          this.draw();

          requestAnimationFrame(time => {
            this.tick(time);
          });
        }
      }

      new BasketballGame();
      canvas.focus({ preventScroll: true });
    })();
  </script>
</body>
</html>
